server {
    listen 80;
    listen [::]:80;
    server_name flipper.celox.io;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name flipper.celox.io;

    ssl_certificate     /etc/letsencrypt/live/flipper.celox.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flipper.celox.io/privkey.pem;

    # Downloads can be large and slow; allow long-lived proxy reads and big responses.
    client_max_body_size 8m;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    # Not a public site.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:4253;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;  # stream the media file straight through
    }
}

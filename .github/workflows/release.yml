name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate tag
        id: meta
        env:
          # Untrusted input is passed via env, never inlined into a run: script.
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9A-Za-z._+-]+$'; then
            echo "Invalid tag format: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename per-ABI APKs
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -e
          OUT=app/build/outputs/apk/release
          for abi in arm64-v8a armeabi-v7a; do
            SRC="$OUT/app-$abi-release.apk"
            [ -f "$SRC" ] || { echo "Missing $SRC" >&2; exit 1; }
            cp "$SRC" "flipper-the-ripper-${TAG}-${abi}.apk"
          done
          ls -lh flipper-the-ripper-*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Flipper the Ripper ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            flipper-the-ripper-*-arm64-v8a.apk
            flipper-the-ripper-*-armeabi-v7a.apk

      - name: Clean up keystore
        if: always()
        run: rm -f release.jks
